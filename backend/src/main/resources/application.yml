spring:
  application:
    name: smart-trash

server:
  port: ${PORT:8080}

smarttrash:
  data-source: ${SMARTTRASH_DATA_SOURCE:memory}
  supabase:
    url: ${SUPABASE_URL:}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
  cors:
    allowed-origins: ${SMARTTRASH_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
